name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run setup
        run: ./scripts/setup.sh
        env:
          # Skip API-key-dependent steps; setup should still pull tools and install deps.
          ELEVENLABS_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Verify vendored tools are present
        run: |
          test -f tools/video-use/helpers/timeline_view.py
          test -f tools/hyperframes/package.json

      - name: Verify Python modules import
        run: |
          python3 -c "from modules.captions import generator; print('captions OK')"
          python3 -c "from modules.captions.hooks import extract_hooks; print('hooks OK')"
          python3 -c "from modules.timestamps import generate_timestamps; print('timestamps OK')"
          python3 -c "from modules.thumbnails import extractor, composer, compose_thumbnail_variants; print('thumbnails OK')"
          python3 -c "from modules.motion_graphics import bridge; print('motion_graphics OK')"
          python3 -c "from modules.motion_graphics import add_lower_third_vertical; print('motion_graphics vertical OK')"
          python3 -c "from modules.verify import verify_render; print('verify OK')"

      - name: Test motion graphics preview
        run: |
          python3 -m modules.motion_graphics preview --template templates/editframe/lower-third.html --output /tmp/preview_ef.html
          python3 -m modules.motion_graphics preview --template templates/lower-third.html --output /tmp/preview_hf.html

      - name: Test caption hooks
        run: |
          python3 - <<'PY'
          import json
          from modules.captions.hooks import extract_hooks
          edl = {
              "ranges": [
                  {"start": 0, "end": 5, "beat": "INTRO"},
                  {"start": 5, "end": 10, "beat": "PROBLEM"},
              ],
              "total_duration_s": 10,
          }
          with open("/tmp/hooks_edl.json", "w") as f:
              json.dump(edl, f)
          hooks = extract_hooks("This is the intro. Here is the big problem.", "/tmp/hooks_edl.json", top_n=2)
          assert len(hooks) == 2
          print("hooks OK")
          PY

      - name: Test render quality gate
        run: |
          mkdir -p tmp_ci
          ffmpeg -f lavfi -i testsrc=duration=3:size=640x480:rate=30 -f lavfi -i sine=frequency=1000:duration=3 -pix_fmt yuv420p tmp_ci/test.mp4 -y
          python3 -m modules.verify --video tmp_ci/test.mp4 --out tmp_ci/verify

      - name: Lint Python with ruff
        run: |
          pip install ruff
          ruff check modules/

<!DOCTYPE html>
<!--
  Template: lower-third-vertical.html
  Purpose: 9:16 vertical lower-third for Shorts/Reels.

  HyperFrames Data Variables: same as lower-third.html.
  Design tokens are loaded from templates/design-system.json by the bridge.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lower Third — Vertical</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

    :root {
      --accent-color: #FF5A00;
      --bg-color: rgba(10,10,10,0.85);
      --text-color: #FFFFFF;
      --font: Inter;
      --title-size: 56px;
      --subtitle-size: 30px;
      --line-height-tight: 1.1;
      --line-height-normal: 1.2;
      --margin: 60px;
      --safe-area: 180px;
      --border-radius: 4px;
      --accent-bar-width: 6px;
      --animation-easing: cubic-bezier(0.22,1,0.36,1);
      --animation-duration-in: 0.6s;
      --animation-duration-out: 0.4s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
      overflow: hidden;
      font-family: var(--font), sans-serif;
    }

    .lower-third {
      position: absolute;
      bottom: var(--safe-area);
      left: var(--margin);
      right: var(--margin);
      display: flex;
      align-items: stretch;
      opacity: 0;
      transform: translateX(-60px);
    }

    .accent-bar {
      width: var(--accent-bar-width);
      background: var(--accent-color);
      border-radius: calc(var(--accent-bar-width) / 2);
      transform: scaleY(0);
      transform-origin: bottom;
      margin-right: 20px;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-color);
      padding: 18px 28px;
      border-radius: var(--border-radius);
      flex: 1;
    }

    .name {
      font-size: var(--title-size);
      font-weight: 700;
      color: var(--text-color);
      line-height: var(--line-height-tight);
      letter-spacing: -0.5px;
    }

    .role {
      font-size: var(--subtitle-size);
      font-weight: 400;
      color: var(--accent-color);
      line-height: var(--line-height-normal);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="lower-third-vertical"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="4"
  >
    <div class="lower-third" id="lt">
      <div class="accent-bar" id="bar"></div>
      <div class="text-block">
        <div class="name" id="name-text">Name</div>
        <div class="role" id="role-text">Title</div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const nameEl = document.getElementById('name-text');
    const roleEl = document.getElementById('role-text');
    const lt = document.getElementById('lt');
    const bar = document.getElementById('bar');
    const root = document.documentElement;

    Object.entries(stage.dataset).forEach(([key, value]) => {
      if (value === undefined || value === '') return;
      const cssVar = '--' + key.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
      root.style.setProperty(cssVar, value);
    });

    nameEl.textContent = stage.dataset.title || 'Name';
    roleEl.textContent = stage.dataset.subtitle || '';

    const totalDuration = parseFloat(stage.dataset.duration || '4') * 1000;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInCubic(t) { return t * t * t; }

    const SLIDE_IN = 600;
    const HOLD = Math.max(totalDuration - SLIDE_IN - 400, 500);
    const FADE_OUT = 400;

    let startTime = null;

    function animate(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;

      if (elapsed <= SLIDE_IN) {
        const t = easeOutCubic(elapsed / SLIDE_IN);
        lt.style.opacity = t;
        lt.style.transform = `translateX(${(1 - t) * -60}px)`;
        bar.style.transform = `scaleY(${t})`;
      } else if (elapsed <= SLIDE_IN + HOLD) {
        lt.style.opacity = 1;
        lt.style.transform = 'translateX(0)';
        bar.style.transform = 'scaleY(1)';
      } else if (elapsed <= SLIDE_IN + HOLD + FADE_OUT) {
        const t = easeInCubic((elapsed - SLIDE_IN - HOLD) / FADE_OUT);
        lt.style.opacity = 1 - t;
      } else {
        lt.style.opacity = 0;
        return;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>

<!DOCTYPE html>
<!--
  Template: editframe/chapter-intro.html
  Engine:   Editframe (ef-* web components)
  Purpose:  Centered chapter transition — letter-spacing reveal + fade.

  Render data keys:
    title       — Chapter label (e.g. "The Problem")
    subtitle    — Optional number prefix (e.g. "01" or "Chapter 1")
    accentColor — Accent color (default #FF5A00)
    bgColor     — Background (default #0A0A0A)
    font        — Font family (default Inter)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chapter Intro</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@editframe/composition@latest/dist/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: var(--bg-color, #0A0A0A);
      overflow: hidden;
    }

    @keyframes chapter-in {
      from { opacity: 0; letter-spacing: 24px; }
      to   { opacity: 1; letter-spacing: 6px; }
    }

    @keyframes num-in {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes accent-scale {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <ef-configuration media-engine="local">
    <ef-timegroup
      mode="fixed"
      class="absolute flex flex-col items-center justify-center"
      style="width:1920px; height:1080px; gap:20px;"
    >
      <!-- Chapter number -->
      <ef-text
        id="ef-number"
        style="
          font-family: var(--font, 'Inter'), sans-serif;
          font-size: 20px;
          font-weight: 300;
          color: var(--accent-color, #FF5A00);
          letter-spacing: 6px;
          text-transform: uppercase;
          animation: num-in 0.35s ease both;
        "
      >{{subtitle}}</ef-text>

      <!-- Accent divider -->
      <div style="
        width: 48px;
        height: 2px;
        background: var(--accent-color, #FF5A00);
        border-radius: 1px;
        transform-origin: left;
        animation: accent-scale 0.4s cubic-bezier(0.22,1,0.36,1) both;
        animation-delay: 0.1s;
      "></div>

      <!-- Chapter name -->
      <ef-text
        id="ef-title"
        class="text-white font-bold text-center"
        style="
          font-family: var(--font, 'Inter'), sans-serif;
          font-size: 80px;
          line-height: 1.1;
          max-width: 1200px;
          animation: chapter-in 0.55s cubic-bezier(0.22,1,0.36,1) both;
          animation-delay: 0.15s;
        "
      >{{title}}</ef-text>
    </ef-timegroup>
  </ef-configuration>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const d = window.__EF_DATA__ || {};
      const root = document.documentElement;
      if (d.accentColor) root.style.setProperty('--accent-color', d.accentColor);
      if (d.bgColor)     root.style.setProperty('--bg-color', d.bgColor);
      if (d.font)        root.style.setProperty('--font', d.font);

      const titleEl  = document.getElementById('ef-title');
      const numEl    = document.getElementById('ef-number');
      if (titleEl) titleEl.textContent = d.title    || 'Chapter';
      if (numEl)   numEl.textContent   = d.subtitle || '';
    });
  </script>
</body>
</html>

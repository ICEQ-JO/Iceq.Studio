<!DOCTYPE html>
<!--
  Template: editframe/lower-third-vertical.html
  Engine:   Editframe (ef-* web components)
  Purpose:  9:16 vertical lower-third for Shorts/Reels.

  Variables: same as lower-third.html.
  Design tokens are loaded from templates/design-system.json by the bridge.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lower Third — Vertical</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@editframe/composition@latest/dist/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

    :root {
      --accent-color: #FF5A00;
      --bg-color: rgba(10,10,10,0.88);
      --text-color: #FFFFFF;
      --font: Inter;
      --title-size: 56px;
      --subtitle-size: 30px;
      --line-height-tight: 1.1;
      --line-height-normal: 1.2;
      --margin: 60px;
      --safe-area: 180px;
      --border-radius: 4px;
      --accent-bar-width: 6px;
      --animation-easing: cubic-bezier(0.22,1,0.36,1);
      --animation-duration-in: 0.55s;
      --animation-duration-out: 0.30s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <ef-configuration media-engine="local">
    <ef-timegroup
      mode="fixed"
      class="absolute"
      style="width:1080px; height:1920px;"
    >
      <ef-timegroup
        mode="fixed"
        class="absolute flex items-stretch"
        style="
          bottom: var(--safe-area);
          left: var(--margin);
          right: var(--margin);
          animation: slide-up-fade var(--animation-duration-in) var(--animation-easing) both;
        "
      >
        <div style="
          width: var(--accent-bar-width);
          background: var(--accent-color);
          border-radius: calc(var(--accent-bar-width) / 2);
          margin-right: 18px;
          transform-origin: bottom;
          animation: bar-grow var(--animation-duration-in) var(--animation-easing) both;
        "></div>

        <div style="
          background: var(--bg-color);
          padding: 18px 28px;
          border-radius: var(--border-radius);
          display: flex;
          flex-direction: column;
          gap: 8px;
          flex: 1;
        ">
          <ef-text
            class="font-bold"
            style="
              font-family: var(--font), sans-serif;
              font-size: var(--title-size);
              color: var(--text-color);
              line-height: var(--line-height-tight);
              letter-spacing: -0.5px;
            "
          >{{title}}</ef-text>

          <ef-text
            style="
              font-family: var(--font), sans-serif;
              font-size: var(--subtitle-size);
              font-weight: 400;
              color: var(--accent-color);
              line-height: var(--line-height-normal);
              letter-spacing: 0.5px;
              text-transform: uppercase;
            "
          >{{subtitle}}</ef-text>
        </div>
      </ef-timegroup>
    </ef-timegroup>
  </ef-configuration>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const d = window.__EF_DATA__ || {};
      const root = document.documentElement;

      const toKebab = (s) => s.replace(/[A-Z]/g, m => '-' + m.toLowerCase());

      Object.entries(d).forEach(([key, value]) => {
        if (value === undefined || value === null || value === '') return;
        const cssVar = '--' + toKebab(key);
        root.style.setProperty(cssVar, value);
      });

      document.querySelectorAll('ef-text').forEach(el => {
        const raw = el.textContent.trim();
        if (raw === '{{title}}')    el.textContent = d.title    || 'Name';
        if (raw === '{{subtitle}}') el.textContent = d.subtitle || '';
      });
    });
  </script>
</body>
</html>

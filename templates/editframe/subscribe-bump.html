<!DOCTYPE html>
<!--
  Template: editframe/subscribe-bump.html
  Engine:   Editframe (ef-* web components)
  Purpose:  Corner subscribe animation — pops in bottom-right for 3s.

  Render data keys:
    title       — Button label (default "Subscribe")
    accentColor — Button background + bell color (default #FF0000)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subscribe Bump</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@editframe/composition@latest/dist/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    @keyframes bump-in {
      0%   { opacity: 0; transform: translateY(24px) scale(0.9); }
      60%  { transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes bell-shake {
      0%, 100% { transform: rotate(0deg); }
      20%       { transform: rotate(-18deg); }
      40%       { transform: rotate(16deg); }
      60%       { transform: rotate(-10deg); }
      80%       { transform: rotate(8deg); }
    }
  </style>
</head>
<body>
  <ef-configuration media-engine="local">
    <ef-timegroup
      mode="fixed"
      class="absolute"
      style="width:1920px; height:1080px;"
    >
      <!-- Subscribe pill — bottom right corner -->
      <div style="
        position: absolute;
        bottom: 80px;
        right: 80px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(10,10,10,0.9);
        border-radius: 40px;
        padding: 14px 26px 14px 18px;
        animation: bump-in 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        box-shadow: 0 4px 32px rgba(0,0,0,0.5);
      ">
        <!-- Bell icon -->
        <svg
          width="32" height="32" viewBox="0 0 24 24" fill="none"
          style="
            color: var(--accent-color, #FF0000);
            animation: bell-shake 0.7s ease 0.6s both;
          "
        >
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"
                fill="currentColor"/>
        </svg>

        <!-- Subscribe button -->
        <div style="
          background: var(--accent-color, #FF0000);
          border-radius: 24px;
          padding: 8px 20px;
          display: flex;
          align-items: center;
          gap: 8px;
        ">
          <ef-text style="
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 0.3px;
          ">{{title}}</ef-text>
        </div>
      </div>
    </ef-timegroup>
  </ef-configuration>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const d = window.__EF_DATA__ || {};
      const root = document.documentElement;
      if (d.accentColor) root.style.setProperty('--accent-color', d.accentColor);

      const labelEl = document.querySelector('ef-text');
      if (labelEl) labelEl.textContent = d.title || 'Subscribe';
    });
  </script>
</body>
</html>

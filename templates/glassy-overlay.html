<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        overflow: hidden;
      }
      /* Lower-third layout: card pinned bottom-left */
      body.layout-lower-third {
        align-items: flex-end;
        justify-content: flex-start;
      }
      body.layout-lower-third .glass-card {
        margin-bottom: 100px;
        margin-left: 80px;
        width: 700px;
        padding: 30px 40px;
      }
      .glass-card {
        width: 800px;
        padding: 50px 60px;
        border-radius: 36px;
        background: rgba(20, 20, 30, 0.82);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        opacity: 0;
        transform: translateY(60px) scale(0.95);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .title {
        margin: 0;
        font-size: 58px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -1.5px;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        line-height: 1.15;
      }
      .subtitle {
        margin: 0;
        font-size: 28px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: -0.5px;
        text-transform: uppercase;
        order: -1;
      }
      .accent-line {
        width: 0%;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
      }
    </style>
  </head>
  <body>
    <div
        id="stage"
        data-composition-id="glassy-overlay"
        data-start="0"
        data-width="1920"
        data-height="1080"
        data-duration="5">
      <div class="glass-card" id="card">
        <h2 class="subtitle" id="subtitle-text">Subtitle</h2>
        <div class="accent-line" id="line"></div>
        <h1 class="title" id="title-text">Main Title</h1>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      const stage = document.getElementById('stage');
      const subtitleEl = document.getElementById('subtitle-text');
      const titleEl = document.getElementById('title-text');
      const card = document.getElementById('card');

      const title = stage.dataset.title || 'Title';
      const subtitle = stage.dataset.subtitle || 'Subtitle';
      const layout = stage.dataset.layout || 'center';
      const duration = parseFloat(stage.dataset.duration || '5');

      titleEl.textContent = title;
      subtitleEl.textContent = subtitle;

      if (layout === 'lower-third') {
        document.body.classList.add('layout-lower-third');
      }

      gsap.defaults({ ease: "power4.out" });
      const tl = gsap.timeline();

      // Entrance: slide up + fade in
      tl.to(card, {
        y: 0,
        scale: 1,
        opacity: 1,
        duration: 1.4,
        ease: "expo.out"
      }, 0.1);

      tl.to("#line", {
        width: "100%",
        duration: 1.0,
        ease: "power3.out"
      }, 0.5);

      // Exit: fade and slide away
      tl.to(card, {
        y: -40,
        scale: 1.03,
        opacity: 0,
        duration: 0.7,
        ease: "power3.in"
      }, duration - 0.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["glassy-overlay"] = tl;
    </script>
  </body>
</html>

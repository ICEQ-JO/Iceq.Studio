<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        /* transparent bounding box */
        background: transparent;
        overflow: hidden;
      }
      .glass-card {
        width: 800px;
        padding: 50px 60px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        opacity: 0;
        transform: translateY(60px) scale(0.95);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .title {
        margin: 0;
        font-size: 64px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -1.5px;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
      }
      .subtitle {
        margin: 0;
        font-size: 32px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: -0.5px;
      }
      .accent-line {
        width: 0%;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, #FFFFFF 0%, rgba(255,255,255,0) 100%);
      }
    </style>
  </head>
  <body>
    <!-- Added required hyperframes root attributes -->
    <div 
        id="stage" 
        data-composition-id="title-card" 
        data-start="0" 
        data-width="1920" 
        data-height="1080" 
        data-duration="6">
      <div class="glass-card" id="card">
        <h1 class="title" data-title>Gemma 4 Architecture</h1>
        <div class="accent-line" id="line"></div>
        <h2 class="subtitle" data-subtitle>The math behind MoE & PLE</h2>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      gsap.defaults({ ease: "power4.out" });

      const tl = gsap.timeline();

      // Entrance
      tl.to("#card", {
        y: 0,
        scale: 1,
        opacity: 1,
        duration: 2.0,
        ease: "expo.out"
      }, 0);

      tl.to("#line", {
        width: "100%",
        duration: 1.8,
        ease: "power3.out"
      }, 0.5);

      const duration = 6.0;

      // Exit
      tl.to("#card", {
        y: -40,
        scale: 1.05,
        opacity: 0,
        duration: 1.0,
        ease: "power3.in"
      }, duration - 1.0);

      // HYPERFRAMES REGISTRATION
      window.__timelines = window.__timelines || {};
      window.__timelines["title-card"] = tl;
    </script>
  </body>
</html>

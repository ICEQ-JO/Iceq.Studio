<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        overflow: hidden;
      }
      .glass-card {
        width: 850px;
        padding: 40px 50px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(50px) saturate(200%);
        -webkit-backdrop-filter: blur(50px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        opacity: 0;
        transform: translateY(40px) scale(0.92);
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      /* Variation for Lower Third */
      body.lower-third {
        align-items: flex-end;
        justify-content: flex-start;
      }
      body.lower-third .glass-card {
        margin-bottom: 100px;
        margin-left: 80px;
        width: 700px;
        padding: 30px 40px;
      }
      .title {
        margin: 0;
        font-size: 58px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -1.8px;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        line-height: 1.1;
      }
      .subtitle {
        margin: 0;
        font-size: 28px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        letter-spacing: -0.6px;
        text-transform: uppercase;
      }
      .accent-line {
        width: 0%;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, #FFFFFF 0%, rgba(255,255,255,0) 100%);
      }
    </style>
  </head>
  <body>
    <div 
        id="stage" 
        data-composition-id="ios-glassy" 
        data-start="0" 
        data-width="1920" 
        data-height="1080" 
        data-duration="5">
      <div class="glass-card" id="card">
        <h2 class="subtitle" id="subtitle-text">Subtitle</h2>
        <div class="accent-line" id="line"></div>
        <h1 class="title" id="title-text">Main Title</h1>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      const stage = document.getElementById('stage');
      const titleEl = document.getElementById('title-text');
      const subtitleEl = document.getElementById('subtitle-text');
      
      // Update from attributes
      const title = stage.dataset.title || 'Iceq Studio';
      const subtitle = stage.dataset.subtitle || 'Production';
      const layout = stage.dataset.layout || 'center'; // 'center' or 'lower-third'
      const duration = parseFloat(stage.dataset.duration || '5');

      titleEl.textContent = title;
      subtitleEl.textContent = subtitle;
      if (layout === 'lower-third') {
        document.body.classList.add('lower-third');
      }

      gsap.defaults({ ease: "power4.out" });
      const tl = gsap.timeline();

      // Entrance
      tl.to("#card", {
        y: 0,
        scale: 1,
        opacity: 1,
        duration: 1.5,
        ease: "expo.out"
      }, 0.2);

      tl.to("#line", {
        width: "100%",
        duration: 1.2,
        ease: "power3.out"
      }, 0.6);

      // Exit
      tl.to("#card", {
        y: -30,
        scale: 1.02,
        opacity: 0,
        duration: 0.8,
        ease: "power3.in"
      }, duration - 0.8);

      // HYPERFRAMES REGISTRATION
      window.__timelines = window.__timelines || {};
      window.__timelines["ios-glassy"] = tl;
    </script>
  </body>
</html>

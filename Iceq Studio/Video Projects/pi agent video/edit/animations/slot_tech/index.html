<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #000000;
        overflow: hidden;
        color: white;
      }
      .card {
        position: absolute;
        bottom: 140px;
        right: 60px;
        width: 460px;
        padding: 28px 36px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.12);
        opacity: 0;
        transform: translateY(30px) scale(0.96);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .icon-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #34C759;
        box-shadow: 0 0 12px rgba(52, 199, 89, 0.5);
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      .accent-bar {
        width: 0;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #34C759, #30D158);
      }
      .big-number {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
        background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .big-unit {
        font-size: 22px;
        font-weight: 500;
        -webkit-text-fill-color: rgba(255,255,255,0.6);
      }
      .desc {
        font-size: 14px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="stage"
         data-composition-id="tech-card"
         data-start="0"
         data-width="1920"
         data-height="1080"
         data-duration="4">
      <div class="card" id="card">
        <div class="icon-row">
          <div class="icon-dot"></div>
          <span class="label">Architecture</span>
        </div>
        <div class="accent-bar" id="bar"></div>
        <div class="big-number" id="number">
          <span id="counter">0</span> <span class="big-unit">tokens</span>
        </div>
        <p class="desc">Deep-loaded system prompt<br/>Ultra-lightweight, zero bloat</p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      gsap.defaults({ ease: "power4.out" });
      const tl = gsap.timeline();
      const counterEl = document.getElementById("counter");

      // Entrance
      tl.to("#card", {
        y: 0, scale: 1, opacity: 1,
        duration: 0.8, ease: "expo.out"
      }, 0.15);

      tl.to("#bar", {
        width: "100%",
        duration: 0.6, ease: "power3.out"
      }, 0.4);

      // Animate counter from 0 → 200
      tl.to({ val: 0 }, {
        val: 200,
        duration: 1.2,
        ease: "power2.out",
        onUpdate: function() {
          counterEl.textContent = Math.round(this.targets()[0].val);
        }
      }, 0.5);

      // Exit
      tl.to("#card", {
        y: -20, opacity: 0,
        duration: 0.5, ease: "power3.in"
      }, 3.3);

      window.__timelines = { "tech-card": tl };
    </script>
  </body>
</html>

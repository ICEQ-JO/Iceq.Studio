<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #000000;
        overflow: hidden;
        color: white;
      }
      .card {
        position: absolute;
        bottom: 140px;
        left: 60px;
        width: 440px;
        padding: 26px 34px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.12);
        opacity: 0;
        transform: translateY(30px) scale(0.96);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .icon-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #5AC8FA;
        box-shadow: 0 0 12px rgba(90, 200, 250, 0.5);
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      .accent-bar {
        width: 0;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #5AC8FA, #007AFF);
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.6px;
        line-height: 1.2;
      }
      .desc {
        font-size: 14px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="stage"
         data-composition-id="feature-card"
         data-start="0"
         data-width="1920"
         data-height="1080"
         data-duration="3">
      <div class="card" id="card">
        <div class="icon-row">
          <div class="icon-dot"></div>
          <span class="label">Core Feature</span>
        </div>
        <div class="accent-bar" id="bar"></div>
        <h2 class="title">Agentic AI Workflow</h2>
        <p class="desc">A next-generation autonomous agent<br/>powered by intelligent system prompts</p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      gsap.defaults({ ease: "power4.out" });
      const tl = gsap.timeline();

      tl.to("#card", {
        y: 0, scale: 1, opacity: 1,
        duration: 0.8, ease: "expo.out"
      }, 0.15);

      tl.to("#bar", {
        width: "100%",
        duration: 0.6, ease: "power3.out"
      }, 0.4);

      tl.to("#card", {
        y: -20, opacity: 0,
        duration: 0.5, ease: "power3.in"
      }, 2.3);

      window.__timelines = { "feature-card": tl };
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #000000;
        overflow: hidden;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 520px;
        padding: 32px 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.12);
        opacity: 0;
        transform: scale(0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .icon-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #FF9F0A;
        box-shadow: 0 0 12px rgba(255, 159, 10, 0.5);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.3); }
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      .accent-bar {
        width: 0;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #FF9F0A, #FF375F);
      }
      .title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.8px;
        line-height: 1.2;
      }
      .desc {
        font-size: 15px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.4;
      }
      .arrow {
        font-size: 28px;
        opacity: 0;
        transform: translateY(10px);
      }
    </style>
  </head>
  <body>
    <div id="stage"
         data-composition-id="demo-card"
         data-start="0"
         data-width="1920"
         data-height="1080"
         data-duration="3">
      <div class="card" id="card">
        <div class="icon-row">
          <div class="icon-dot"></div>
          <span class="label">Up Next</span>
        </div>
        <div class="accent-bar" id="bar"></div>
        <h2 class="title">Live Demo</h2>
        <p class="desc">Let's put Pi agent to the test</p>
        <div class="arrow" id="arrow">→</div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
      gsap.defaults({ ease: "power4.out" });
      const tl = gsap.timeline();

      // Entrance — scale up from center
      tl.to("#card", {
        scale: 1, opacity: 1,
        duration: 0.8, ease: "expo.out"
      }, 0.15);

      tl.to("#bar", {
        width: "100%",
        duration: 0.6, ease: "power3.out"
      }, 0.4);

      // Arrow slides in
      tl.to("#arrow", {
        y: 0, opacity: 1,
        duration: 0.5, ease: "back.out(1.7)"
      }, 0.7);

      // Exit
      tl.to("#card", {
        scale: 1.05, opacity: 0,
        duration: 0.5, ease: "power3.in"
      }, 2.3);

      window.__timelines = { "demo-card": tl };
    </script>
  </body>
</html>
